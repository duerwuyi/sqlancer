name: ci

on:
  push:
    branches:
      - main
      - citus_test
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/*.yml'
      - 'pom.xml'
  pull_request:
    branches:
      - main
      - citus_test
    paths:
      - 'src/**'
      - 'test/**'
      - '.github/workflows/*.yml'
      - 'pom.xml'
  workflow_dispatch:

env:
  SQLANCER_NUM_QUERIES: "1000000000"

jobs:
  citus:
    name: Citus slice ${{ matrix.slice }}
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build SQLancer
        run: mvn -B package -DskipTests=true
      - name: Set up Citus
        run: |
          echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          curl https://install.citusdata.com/community/deb.sh | sudo bash
          sudo sed -i 's/noble/jammy/g' /etc/apt/sources.list.d/citusdata_community.list
          sudo apt-get update
          sudo apt-get -y install postgresql-17-citus-13.0
          sudo chown -R $USER:$USER /var/run/postgresql
          export PATH=/usr/lib/postgresql/17/bin:$PATH
          cd ~
          mkdir -p citus/coordinator citus/worker1 citus/worker2
          initdb -D citus/coordinator
          initdb -D citus/worker1
          initdb -D citus/worker2
          echo "shared_preload_libraries = 'citus'" >> citus/coordinator/postgresql.conf
          echo "shared_preload_libraries = 'citus'" >> citus/worker1/postgresql.conf
          echo "shared_preload_libraries = 'citus'" >> citus/worker2/postgresql.conf
          pg_ctl -D citus/coordinator -o "-p 9700" -l coordinator_logfile start
          pg_ctl -D citus/worker1 -o "-p 9701" -l worker1_logfile start
          pg_ctl -D citus/worker2 -o "-p 9702" -l worker2_logfile start
          psql -c "CREATE ROLE sqlancer SUPERUSER LOGIN CREATEDB PASSWORD 'sqlancer';" -p 9700 -d postgres -U $USER
          createdb test -p 9700 -U $USER
          psql -c "CREATE ROLE sqlancer SUPERUSER LOGIN CREATEDB PASSWORD 'sqlancer';" -p 9701 -d postgres -U $USER
          createdb test -p 9701 -U $USER
          psql -c "CREATE ROLE sqlancer SUPERUSER LOGIN CREATEDB PASSWORD 'sqlancer';" -p 9702 -d postgres -U $USER
          createdb test -p 9702 -U $USER
          psql -c "CREATE EXTENSION citus;" -p 9700 -U $USER -d test
          psql -c "CREATE EXTENSION citus;" -p 9701 -U $USER -d test
          psql -c "CREATE EXTENSION citus;" -p 9702 -U $USER -d test
          psql -c "SELECT * FROM citus_add_node('localhost', 9701);" -p 9700 -U $USER -d test
          psql -c "SELECT * FROM citus_add_node('localhost', 9702);" -p 9700 -U $USER -d test
      - name: Run Citus long slice
        env:
          CITUS_AVAILABLE: "true"
          SQLANCER_RANDOM_SEED: ${{ 100000 * matrix.slice }}
          SQLANCER_TIMEOUT_SECONDS: "21000"
        run: mvn -B -Djacoco.skip=true -Dtest=TestCitus test
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citus-slice-${{ matrix.slice }}
          path: |
            logs/
            target/surefire-reports/

  postgres:
    name: PostgreSQL slice ${{ matrix.slice }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PostgreSQL
        uses: harmon758/postgresql-action@v1.0.0
        with:
          postgresql version: '18'
          postgresql user: 'sqlancer'
          postgresql password: 'sqlancer'
          postgresql db: 'test'
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build SQLancer
        run: mvn -B package -DskipTests=true
      - name: Run PostgreSQL PQS
        env:
          POSTGRES_AVAILABLE: "true"
          SQLANCER_RANDOM_SEED: ${{ 100000 * matrix.slice }}
          SQLANCER_TIMEOUT_SECONDS: "5250"
        run: mvn -B -Djacoco.skip=true -Dtest=TestPostgresPQS test
      - name: Run PostgreSQL TLP
        env:
          POSTGRES_AVAILABLE: "true"
          SQLANCER_RANDOM_SEED: ${{ 100000 * matrix.slice }}
          SQLANCER_TIMEOUT_SECONDS: "5250"
        run: mvn -B -Djacoco.skip=true -Dtest=TestPostgresTLP test
      - name: Run PostgreSQL NoREC
        env:
          POSTGRES_AVAILABLE: "true"
          SQLANCER_RANDOM_SEED: ${{ 100000 * matrix.slice }}
          SQLANCER_TIMEOUT_SECONDS: "5250"
        run: mvn -B -Djacoco.skip=true -Dtest=TestPostgresNoREC test
      - name: Run PostgreSQL CERT
        env:
          POSTGRES_AVAILABLE: "true"
          SQLANCER_RANDOM_SEED: ${{ 100000 * matrix.slice }}
          SQLANCER_TIMEOUT_SECONDS: "5250"
        run: mvn -B -Djacoco.skip=true -Dtest=TestPostgresCERT test
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-slice-${{ matrix.slice }}
          path: |
            logs/
            target/surefire-reports/

  clickhouse:
    name: ClickHouse slice ${{ matrix.slice }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build SQLancer
        run: mvn -B package -DskipTests=true
      - name: Set up ClickHouse
        run: |
          docker pull clickhouse/clickhouse-server:24.3.1.2672
          docker run --ulimit nofile=262144:262144 --name clickhouse-server -p8123:8123 -d clickhouse/clickhouse-server:24.3.1.2672
          until curl -sf http://127.0.0.1:8123/ping 2>/dev/null; do sleep 1; done
      - name: Run ClickHouse long slice
        env:
          CLICKHOUSE_AVAILABLE: "true"
          SQLANCER_RANDOM_SEED: ${{ 100000 * matrix.slice }}
          SQLANCER_TIMEOUT_SECONDS: "21000"
        run: mvn -B -Djacoco.skip=true -Dtest=TestClickHouse test
      - name: Show fatal errors
        if: always()
        run: docker exec clickhouse-server grep Fatal /var/log/clickhouse-server/clickhouse-server.log || echo No Fatal Errors found
      - name: Teardown ClickHouse server
        if: always()
        run: |
          docker stop clickhouse-server
          docker rm clickhouse-server
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-slice-${{ matrix.slice }}
          path: |
            logs/
            target/surefire-reports/
